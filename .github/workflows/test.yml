name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  unittest:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify pinned guard baseline is available
        run: git cat-file -e '3cf5fccaa395f1dbe709b0ce800d1ad412418d39^{commit}'
      - name: Install test-only dependencies
        run: python -m pip install -r tests/requirements-test.txt
      - name: Run one discovery with guard and coverage checks
        run: python tests/run_parallel.py --ci-guard
