<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'sha256-{{SCRIPT_SHA256}}'; base-uri 'none'; form-action 'none'">
<title>Review - {{TITLE}}</title>
<style>
:root{--bg:#F6FAFC;--fg:#1F2A30;--muted:#567D89;--line:#D5E2E8;--card:#FFFFFF;--card-hover:#F8FCFD;--accent:#00677C;--accent-hover:#005061;--accent-light:#E0F4F8;--ok:#0F766E;--ok-bg:#ECFDF5;--ok-line:#A7F3D0;--warn-bg:#FFFBEB;--warn-line:#F59E0B;--warn-text:#92400E;--mand-bg:#FEF2F2;--mand-line:#EF4444;--mand-text:#991B1B;--code:#EDF3F6;--shadow-sm:0 1px 2px rgba(15,23,42,0.04);--shadow-md:0 4px 6px -1px rgba(15,23,42,0.06);--radius-sm:6px;--radius-md:10px;--radius-pill:9999px}
@media (prefers-color-scheme:dark){:root{--bg:#0D1317;--fg:#E6ECEF;--muted:#8BA3AD;--line:#243138;--card:#141C21;--card-hover:#192329;--accent:#4CD6EE;--accent-hover:#67E8F9;--accent-light:#162C35;--ok:#34D399;--ok-bg:#064E3B;--ok-line:#059669;--warn-bg:#382405;--warn-line:#D97706;--warn-text:#FDE68A;--mand-bg:#450A0A;--mand-line:#DC2626;--mand-text:#FECACA;--code:#1B262D;--shadow-sm:0 1px 2px rgba(0,0,0,0.25);--shadow-md:0 4px 6px rgba(0,0,0,0.3)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-width:360px}
header.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 20px 8px;box-shadow:var(--shadow-sm)}
@media (prefers-color-scheme:dark){header.top{background:rgba(20,28,33,0.94)}}
header.top h1{font-size:1.25rem;font-weight:700;letter-spacing:-0.02em;margin:0 0 6px;color:var(--fg);display:flex;align-items:center;gap:10px}
header.top h1::before{content:"AIDD";display:inline-block;font-size:0.68rem;font-weight:800;letter-spacing:0.08em;padding:2px 7px;border-radius:var(--radius-pill);background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){header.top h1::before{color:#0D1317}}
.meta{color:var(--muted);font-size:0.82rem;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.meta span{display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--radius-pill);background:var(--code);border:1px solid var(--line);font-family:ui-monospace,Consolas,monospace}
#aidd-progress{font-weight:700;background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
button{font:inherit;font-size:0.88rem;min-height:38px;padding:6px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card);color:var(--fg);cursor:pointer;transition:all 0.15s ease-in-out;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover:not([disabled]){background:var(--code);border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,103,124,0.25)}
@media (prefers-color-scheme:dark){button.primary{color:#0D1317;font-weight:700}}
button.primary:hover:not([disabled]){background:var(--accent-hover);border-color:var(--accent-hover);transform:translateY(-1px);box-shadow:0 3px 6px rgba(0,103,124,0.3)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:20px 16px 40px;max-width:980px;margin:0 auto}
section[data-key]{border-top:1px solid var(--line);padding-top:12px;margin-top:20px}
section.mandatory{background:var(--mand-bg);border:1px solid var(--mand-line);border-left:4px solid var(--mand-line);border-radius:var(--radius-md);padding:12px 16px;box-shadow:var(--shadow-sm)}
section.checked>.review-ctl .lbl{color:var(--ok);font-weight:700}
.review-ctl{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;margin:10px 0;box-shadow:var(--shadow-sm)}
.review-ctl label{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.review-ctl label input{width:18px;height:18px;cursor:pointer;accent-color:var(--accent)}
.review-ctl textarea{width:100%;min-height:4em;margin-top:8px;font:inherit;font-size:0.88rem;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;transition:border-color 0.15s}
.review-ctl textarea:focus{border-color:var(--accent);background:var(--card)}
.filebar{margin:20px 0 0;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:var(--shadow-sm)}
.filebar b{overflow-wrap:anywhere;font-size:0.95rem;color:var(--accent)}
.warn{background:var(--warn-bg);border:1px solid var(--warn-line);border-left:4px solid var(--warn-line);border-radius:var(--radius-sm);padding:10px 14px;margin:10px 16px;color:var(--warn-text);font-size:0.88rem}
#aidd-sent{background:var(--warn-bg);border:1px solid var(--warn-line);border-left:4px solid var(--warn-line);border-radius:var(--radius-md);padding:14px;margin:14px 16px;color:var(--warn-text);box-shadow:var(--shadow-sm)}
code{background:var(--code);padding:2px 6px;border-radius:4px;font-size:0.88em;font-family:ui-monospace,Consolas,monospace;overflow-wrap:anywhere}
pre{background:var(--code);padding:12px;border-radius:var(--radius-sm);overflow-x:auto;max-width:100%;border:1px solid var(--line)}
table{border-collapse:collapse;display:block;max-width:100%;overflow-x:auto;margin:12px 0}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--code);font-weight:600}
img{max-width:100%;height:auto;border-radius:var(--radius-sm)}
blockquote{margin:10px 0;padding:4px 14px;border-left:3px solid var(--accent);color:var(--muted);background:var(--card)}
h1,h2,h3,h4,p,li{overflow-wrap:anywhere}
.hidden{display:none}
@media print{header.top{position:static;box-shadow:none}.review-ctl textarea{border:1px solid #000}}
</style>
</head>
<body>
<header class="top" id="aidd-root" data-spec="{{SPEC_ID}}" data-tasks-hash="{{TASKS_HASH}}" data-tasks-hash8="{{TASKS_HASH8}}" data-sources-digest="{{SOURCES_DIGEST}}" data-generated="{{GENERATED}}">
<h1>{{TITLE}}</h1>
<div class="meta"><span>spec {{SPEC_ID}}</span><span>tasks hash {{TASKS_HASH8}}</span><span>generated {{GENERATED}}</span><span id="aidd-progress" aria-live="polite"></span></div>
<div class="bar" id="aidd-bar"></div>
</header>
<noscript><div class="warn">This page needs JavaScript to record your review. Without it: read the sections below, then create <code>review.md</code> by hand under the spec folder (front matter with spec, tasks_hash, sources_digest, approved; then one <code>## section-key</code> block per section with <code>- [x] Approved</code> and comment lines starting with <code>&gt; </code>) and answer with <code>approve [tasks:{{TASKS_HASH8}}]</code>.</div></noscript>
<div id="aidd-sent" class="hidden" role="status"></div>
<main id="aidd-main">
{{BODY}}
</main>
<script type="application/json" id="aidd-data">{{DATA_JSON}}</script>
<script id="aidd-js">
'use strict';
/* aidd:FR-203 pure serializer: the review.md grammar of plan.md. No DOM access. */
function oneLine(v) { return String(v == null ? '' : v).replace(/[\r\n]+/g, ' ').trim(); }
function buildReviewMd(data) {
  var d = data || {};
  var secs = d.sections || {};
  var keys = Array.isArray(d.keys) ? d.keys : Object.keys(secs);
  var all = keys.length > 0;
  var blocks = [];
  keys.forEach(function (k) {
    var s = secs[k] || {};
    var on = s.approved === true;
    if (!on) all = false;
    var b = '## ' + String(k).replace(/\s+/g, '-') + '\n- [' + (on ? 'x' : ' ') + '] Approved';
    var c = String(s.comment == null ? '' : s.comment).replace(/\r\n?/g, '\n').replace(/\s+$/, '');
    if (c) b += '\n' + c.split('\n').map(function (l) { return '> ' + l; }).join('\n');
    blocks.push(b);
  });
  var head = ['---', 'spec: ' + oneLine(d.spec), 'tasks_hash: ' + oneLine(d.tasks_hash),
    'sources_digest: ' + oneLine(d.sources_digest), 'format: headings-v1', 'approved: ' + (all ? 'true' : 'false')];
  if (d.generated) head.push('generated: ' + oneLine(d.generated));
  if (d.reviewed) head.push('reviewed: ' + oneLine(d.reviewed));
  head.push('---');
  return head.join('\n') + '\n' + blocks.join('\n') + (blocks.length ? '\n' : '');
}
if (typeof module !== 'undefined' && module.exports) { module.exports = { buildReviewMd: buildReviewMd }; }

/* DOM wiring: only in a browser. data goes in through textContent only. */
if (typeof document !== 'undefined') {
  (function () {
    var root = document.getElementById('aidd-root');
    var A = function (n) { return (root && root.getAttribute(n)) || ''; };
    var meta = { spec: A('data-spec'), tasks_hash: A('data-tasks-hash'), hash8: A('data-tasks-hash8'),
      sources_digest: A('data-sources-digest'), generated: A('data-generated') };
    var store = 'aidd-review:' + meta.spec + ':' + meta.tasks_hash + ':' + meta.sources_digest;
    var prior = {};
    try { var raw = JSON.parse(document.getElementById('aidd-data').textContent || '{}'); prior = (raw && raw.prior) || {}; } catch (e) { prior = {}; }
    try { var saved = window.localStorage.getItem(store); if (saved) prior = JSON.parse(saved) || prior; } catch (e) { /* storage may be blocked */ }

    var sections = Array.prototype.slice.call(document.querySelectorAll('section[data-key]'));
    var state = {}, boxes = {};
    function mk(tag, text, cls) { var e = document.createElement(tag); if (text) e.textContent = text; if (cls) e.className = cls; return e; }
    function persist() { try { window.localStorage.setItem(store, JSON.stringify(state)); } catch (e) { /* ignore */ } }
    function refresh() {
      var n = 0;
      sections.forEach(function (s) {
        var k = s.getAttribute('data-key'), on = state[k].approved === true;
        if (on) n++;
        boxes[k].checked = on;
        s.classList.toggle('checked', on);
      });
      document.getElementById('aidd-progress').textContent = n + ' / ' + sections.length + ' approved';
      persist();
    }
    sections.forEach(function (s) {
      var k = s.getAttribute('data-key'), p = prior[k] || {};
      state[k] = { approved: p.approved === true, comment: typeof p.comment === 'string' ? p.comment : '' };
      var ctl = mk('div', '', 'review-ctl'), lab = mk('label', '', ''), cb = mk('input'), t = mk('span', ' Approved', 'lbl');
      cb.type = 'checkbox'; lab.appendChild(cb); lab.appendChild(t);
      var ta = mk('textarea'); ta.setAttribute('aria-label', 'Comment for ' + k); ta.value = state[k].comment;
      ctl.appendChild(lab); ctl.appendChild(ta);
      var h = s.firstElementChild;
      s.insertBefore(ctl, h ? h.nextSibling : null);
      cb.addEventListener('change', function () { state[k].approved = cb.checked; refresh(); });
      ta.addEventListener('input', function () { state[k].comment = ta.value; persist(); });
      boxes[k] = cb;
    });

    function setGroup(prefix, on) {   /* skips data-mandatory sections (FR-203) */
      sections.forEach(function (s) {
        var k = s.getAttribute('data-key');
        if (s.hasAttribute('data-mandatory')) return;
        if (prefix === '' || k.indexOf(prefix) === 0) state[k].approved = on;
      });
      refresh();
    }
    var bar = document.getElementById('aidd-bar'), seen = {};
    var all = mk('button', 'Approve all (except mandatory)'); all.type = 'button';
    all.addEventListener('click', function () { setGroup('', true); });
    bar.appendChild(all);
    var send = mk('button', 'Send', 'primary'); send.type = 'button'; bar.appendChild(send);
    sections.forEach(function (s) {
      var k = s.getAttribute('data-key'), f = k.split('/')[0];
      if (seen[f]) return;
      seen[f] = 1;
      var row = mk('div', '', 'filebar'); row.appendChild(mk('b', f));
      var b = mk('button', 'Check all in ' + f); b.type = 'button';
      b.addEventListener('click', function () { setGroup(f + '/', true); });
      var u = mk('button', 'Uncheck all'); u.type = 'button';
      u.addEventListener('click', function () { setGroup(f + '/', false); });
      row.appendChild(b); row.appendChild(u);
      s.parentNode.insertBefore(row, s);
    });

    function stamp() {
      var d = new Date(), z = function (n) { return (n < 10 ? '0' : '') + n; };
      return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + 'T' + z(d.getHours()) + ':' + z(d.getMinutes()) + ':' + z(d.getSeconds());
    }
    send.addEventListener('click', function () {
      var text = buildReviewMd({ spec: meta.spec, tasks_hash: meta.tasks_hash, sources_digest: meta.sources_digest,
        generated: meta.generated, reviewed: stamp(), keys: sections.map(function (s) { return s.getAttribute('data-key'); }), sections: state });
      var note = document.getElementById('aidd-sent');
      note.textContent = '';
      var line = 'approve [tasks:' + meta.hash8 + ']';
      try {
        var url = URL.createObjectURL(new Blob([text], { type: 'application/octet-stream' }));
        var a = document.createElement('a'); a.href = url; a.download = 'review.md';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        note.appendChild(mk('p', 'review.md downloaded. Move it into specs/' + meta.spec + '/ (replace any previous review.md). Then give your consent to the agent by pasting this line, or by answering the tagged question:'));
      } catch (e) {
        note.appendChild(mk('p', 'The download was blocked. Copy the text below into specs/' + meta.spec + '/review.md, then give your consent with the line after it.'));
        var box = mk('textarea'); box.readOnly = true; box.value = text; box.style.width = '100%'; box.style.minHeight = '8em'; note.appendChild(box);
      }
      note.appendChild(mk('code', line));
      var cp = mk('button', 'Copy consent line'); cp.type = 'button';
      cp.addEventListener('click', function () {
        try { navigator.clipboard.writeText(line); cp.textContent = 'Copied'; } catch (e) { cp.textContent = 'Select and copy the line manually'; }
      });
      note.appendChild(cp);
      note.classList.remove('hidden');
      note.scrollIntoView();
    });
    refresh();
  })();
}
</script>
</body>
</html>
