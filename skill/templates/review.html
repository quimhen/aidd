<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'sha256-{{SCRIPT_SHA256}}'; base-uri 'none'; form-action 'none'">
<title>Review - {{TITLE}}</title>
<!-- aidd:FR-303 aidd:FR-305 aidd:FR-310 aidd:FR-311 aidd:FR-312 compact tabbed review page (spec 008) -->
<style>
:root{--bg:#fff;--fg:#1d2430;--muted:#5b6678;--line:#d5dae3;--card:#f6f8fb;--accent:#1f5fbf;--ok:#1b7f3b;--warn-bg:#fff4d6;--warn-line:#d9a400;--mand-bg:#fff0f0;--mand-line:#c0392b;--code:#eef1f6;--sel:#e3ecfa}
@media (prefers-color-scheme:dark){:root{--bg:#14181f;--fg:#e4e8ef;--muted:#9aa5b8;--line:#2f3846;--card:#1c222c;--accent:#6fa3ef;--ok:#52c27a;--warn-bg:#3a3017;--warn-line:#b38a00;--mand-bg:#3a1c1c;--mand-line:#e0675a;--code:#232b37;--sel:#22324a}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-width:360px}
header.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px}
header.top h1{font-size:1.1rem;margin:0 0 4px;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;gap:4px 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
button{font:inherit;min-height:44px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer}
button[disabled]{opacity:.55;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#aidd-progress{font-weight:600}
#aidd-alert:empty,#aidd-status:empty{display:none}
#aidd-alert{background:var(--mand-bg);border:2px solid var(--mand-line);border-radius:6px;padding:8px 12px;margin-top:8px;font-weight:600;overflow-wrap:anywhere}
#aidd-status{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:6px;padding:8px 12px;margin-top:8px;overflow-wrap:anywhere}
#aidd-status p{margin:4px 0}
#aidd-status textarea{width:100%;min-height:8em;font:13px/1.4 ui-monospace,Consolas,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;white-space:nowrap;margin-top:8px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
[role="tab"]{flex:0 0 auto;border-radius:6px 6px 0 0;border-bottom:3px solid transparent}
[role="tab"][aria-selected="true"]{background:var(--sel);border-bottom-color:var(--accent);font-weight:600}
[role="tab"] .badge{display:inline-block;margin-left:6px;padding:0 6px;border-radius:9px;background:var(--code);font-size:.8rem;font-weight:400}
[role="tab"] .badge.done{background:var(--ok);color:#fff}
main{padding:16px;max-width:960px;margin:0 auto}
[role="tabpanel"]{padding:0}
[role="tabpanel"] > h2{font-size:1.05rem;margin:0 0 8px}
.tabbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.tabbar .why{color:var(--muted);font-size:.9rem}
.carry{color:var(--muted);margin:0 0 12px;overflow-wrap:anywhere}
.aidd-warn{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:6px;padding:8px 12px 8px 28px;margin:0 0 12px}
.aidd-item{display:grid;grid-template-columns:44px 1fr;gap:0 8px;align-items:start;border-top:1px solid var(--line);padding:8px 0}
.aidd-item > .ck{grid-row:1 / span 6;display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;cursor:pointer}
.aidd-item > .ck input{width:22px;height:22px;margin:0;cursor:pointer}
.aidd-item > *:not(.ck){grid-column:2}
.aidd-item .code{font-weight:700;font-family:ui-monospace,Consolas,monospace;overflow-wrap:anywhere}
.aidd-item .txt,.aidd-item .ans,.aidd-item .src{overflow-wrap:anywhere}
.aidd-item .src{color:var(--muted);font-size:.85rem}
.aidd-item.checked .code{color:var(--ok)}
.aidd-item[data-mandatory]{background:var(--mand-bg);border-left:4px solid var(--mand-line);padding-left:4px}
.aidd-item[data-unanswered] .ans,.aidd-item[data-edge] .code{color:var(--mand-line)}
.aidd-item .aidd-c{width:100%;min-height:44px;margin-top:4px;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px}
.aidd-item.focus{outline:2px solid var(--accent);outline-offset:2px}
details.fallback{margin:16px 0 0;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:6px}
details.fallback summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.warn{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:6px;padding:8px 12px;margin:8px 16px}
code{background:var(--code);padding:1px 4px;border-radius:3px;overflow-wrap:anywhere}
a{color:var(--accent);overflow-wrap:anywhere}
h1,h2,h3,p,li{overflow-wrap:anywhere}
@media print{header.top{position:static}.tabs,.tabbar,#aidd-approve{display:none}[role="tabpanel"],[role="tabpanel"][hidden]{display:block!important;margin-bottom:16px}.aidd-item{break-inside:avoid}.aidd-item .aidd-c{border:1px solid #000}}
</style>
</head>
<body>
<header class="top" id="aidd-root" data-spec="{{SPEC_ID}}" data-tasks-hash="{{TASKS_HASH}}" data-tasks-hash8="{{TASKS_HASH8}}" data-sources-digest="{{SOURCES_DIGEST}}" data-generated="{{GENERATED}}">
<h1>{{TITLE}}</h1>
<div class="meta"><span>spec {{SPEC_ID}}</span><span>tasks hash {{TASKS_HASH8}}</span><span>generated {{GENERATED}}</span><span id="aidd-progress" aria-live="polite"></span></div>
<div class="bar"><button type="button" id="aidd-approve" class="primary">Guardar progreso</button></div>
<div id="aidd-alert" role="alert"></div>
<div id="aidd-status" role="status" aria-live="polite"></div>
<div class="tabs" id="aidd-tablist" role="tablist" aria-label="Secciones"></div>
</header>
<noscript><div class="warn">This page needs JavaScript to record your review. Without it: read the items below, then create <code>review.md</code> by hand in specs/{{SPEC_ID}}/ with a front matter (<code>spec</code>, <code>tasks_hash</code>, <code>sources_digest</code>, <code>format: codes-v2</code>, <code>approved</code>) between two <code>---</code> lines, then one line per code: <code>- [x] FR-301</code> when approved or <code>- [ ] FR-301</code> when not, each optionally followed by one comment line starting with <code>&gt; </code>; then answer with <code>approve [tasks:{{TASKS_HASH8}}]</code>.</div></noscript>
<main id="aidd-main">
{{BODY}}
<details class="fallback"><summary>Fallback: typed consent</summary><p>Only if the direct save and the download both fail: put review.md in the spec folder by hand, then paste this line to the agent:</p><p><code>approve [tasks:{{TASKS_HASH8}}]</code></p></details>
</main>
<script type="application/json" id="aidd-data">{{DATA_JSON}}</script>

    var store = 'aidd-review:' + meta.spec + ':' + meta.tasks_hash + ':' + meta.sources_digest;
    var tabStore = 'aidd-review-tab:' + meta.spec;
    var saved = null;
    try { var raw = window.localStorage.getItem(store); if (raw) saved = JSON.parse(raw); } catch (e) { saved = null; }
    if (!saved || typeof saved !== 'object') saved = {};

    var alertEl = document.getElementById('aidd-alert'), statusEl = document.getElementById('aidd-status');
    var btn = document.getElementById('aidd-approve'), progress = document.getElementById('aidd-progress');
    var tablist = document.getElementById('aidd-tablist');
    function mk(tag, text, cls) { var e = document.createElement(tag); if (text) e.textContent = text; if (cls) e.className = cls; return e; }
    function status(msg) { statusEl.appendChild(mk('p', msg)); }
    CTX.data = { spec: meta.spec, tasks_hash: meta.tasks_hash, picker_id: data.picker_id };
    CTX.w = window; CTX.status = status;

    var panels = Array.prototype.slice.call(document.querySelectorAll('section[role="tabpanel"][data-tab]'));
    var labelOf = {};
    (Array.isArray(data.tabs) ? data.tabs : []).forEach(function (t) { if (t && typeof t.id === 'string' && typeof t.label === 'string') labelOf[t.id] = t.label; });
    var state = {}, order = [], itemEl = {}, boxes = {}, tabOfCode = {}, tabCodes = {}, tabs = [];
    function persist() { try { window.localStorage.setItem(store, JSON.stringify(state)); } catch (e) { /* storage may be blocked */ } }

    panels.forEach(function (panel) {
      var id = panel.getAttribute('data-tab');
      tabCodes[id] = [];
      Array.prototype.slice.call(panel.querySelectorAll('.aidd-item[data-code]')).forEach(function (el) {
        var c = el.getAttribute('data-code');
        if (!isCode(c) || state[c]) return;   /* never a reviewable code, never twice */
        var src = Object.prototype.hasOwnProperty.call(saved, c) ? saved[c] : (Object.prototype.hasOwnProperty.call(prior, c) ? prior[c] : null);
        state[c] = { approved: !!src && src.approved === true, comment: (src && typeof src.comment === 'string') ? src.comment.slice(0, 200) : '' };
        order.push(c); itemEl[c] = el; tabOfCode[c] = id; tabCodes[id].push(c);
        var lab = mk('label', '', 'ck'), cb = mk('input');
        cb.type = 'checkbox'; cb.setAttribute('aria-label', 'Aprobar ' + c); cb.checked = state[c].approved;
        lab.appendChild(cb);
        el.insertBefore(lab, el.firstChild);
        var inp = mk('input', '', 'aidd-c');
        inp.type = 'text'; inp.setAttribute('maxlength', '200'); inp.setAttribute('aria-label', 'Comentario ' + c);
        inp.placeholder = 'Comentario (opcional)'; inp.value = state[c].comment;
        el.appendChild(inp);
        cb.addEventListener('change', function () { state[c].approved = cb.checked; refresh(); });
        inp.addEventListener('input', function () { state[c].comment = inp.value.slice(0, 200); persist(); });
        boxes[c] = cb;
      });
    });

    function tabLabel(id, panel) { return TAB_LABELS[id] || labelOf[id] || (panel && panel.getAttribute('aria-label')) || id; }
    function checkedMap() { var m = {}; order.forEach(function (c) { m[c] = state[c].approved === true; }); return m; }
    function countDone(list) { var n = 0; list.forEach(function (c) { if (state[c].approved) n++; }); return n; }

    /* tabs: roving tabindex, Left/Right/Home/End, #tab-<id> deep link, last tab remembered per session */
    panels.forEach(function (panel) {
      var id = panel.getAttribute('data-tab');
      var b = mk('button', tabLabel(id, panel));
      b.type = 'button'; b.id = 'tabbtn-' + id;
      b.setAttribute('role', 'tab'); b.setAttribute('aria-controls', panel.id || ('tab-' + id));
      b.setAttribute('aria-selected', 'false'); b.tabIndex = -1;
      var badge = mk('span', '', 'badge'); b.appendChild(badge);
      panel.setAttribute('aria-labelledby', b.id); panel.tabIndex = 0;
      tablist.appendChild(b);
      tabs.push({ id: id, btn: b, panel: panel, badge: badge });
      b.addEventListener('click', function () { select(id, true); });
      b.addEventListener('keydown', function (ev) {
        var i = indexOf(id), j = -1;
        if (ev.key === 'ArrowRight') j = (i + 1) % tabs.length;
        else if (ev.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
        else if (ev.key === 'Home') j = 0;
        else if (ev.key === 'End') j = tabs.length - 1;
        if (j < 0) return;
        ev.preventDefault(); select(tabs[j].id, true); tabs[j].btn.focus();
      });
      /* per-tab bulk control: checks only this tab, never data-mandatory (aidd:FR-310 aidd:FR-311) */
      var bar = mk('div', '', 'tabbar'), bulk = mk('button', 'Aprobar todo en esta pesta\u00f1a');
      bulk.type = 'button';
      bar.appendChild(bulk);
      if (id === 'verification') {
        bulk.disabled = true;
        bar.appendChild(mk('span', 'Cada verificaci\u00f3n se marca a mano: confirma que el comando y lo esperado son correctos.', 'why'));
      } else {
        bulk.addEventListener('click', function () {
          tabCodes[id].forEach(function (c) {
            if (c === 'SUMMARY' || c.indexOf('V-') === 0 || itemEl[c].hasAttribute('data-mandatory')) return;
            state[c].approved = true;
          });
          refresh();
        });
      }
      var first = panel.firstElementChild;
      if (first && first.tagName === 'H2') first = first.nextElementSibling;
      while (first && first.classList && first.classList.contains('aidd-warn')) first = first.nextElementSibling;
      panel.insertBefore(bar, first || null);
      if (id === 'summary') {   /* aidd:FR-312 carry-over line */
        var cr = (data.carry && typeof data.carry === 'object') ? data.carry : null;
        if (cr) {
          var pend = Array.isArray(cr.pending) ? cr.pending.filter(isCode) : [];
          var runs = compressCodes(pend);
          var txt = runs.length > MAX_GROUPS ? runs.slice(0, MAX_GROUPS).join(', ') + ' +' + (runs.length - MAX_GROUPS) + ' more' : runs.join(', ');
          panel.insertBefore(mk('p', 'Arrastrados ' + (Number(cr.carried) || 0) + ' de ' + (Number(cr.total) || 0) + '; pendientes: ' + (txt || 'none'), 'carry'), bar);
        }
      }
    });
    function indexOf(id) { for (var i = 0; i < tabs.length; i++) if (tabs[i].id === id) return i; return 0; }
    function select(id, remember) {
      tabs.forEach(function (t) {
        var on = t.id === id;
        t.btn.setAttribute('aria-selected', on ? 'true' : 'false');
        t.btn.tabIndex = on ? 0 : -1;
        t.panel.hidden = !on;
      });
      if (remember) { try { window.sessionStorage.setItem(tabStore, id); } catch (e) { /* storage may be blocked */ } }
    }

    function refresh() {
      var done = countDone(order), total = order.length;
      order.forEach(function (c) { boxes[c].checked = state[c].approved; itemEl[c].classList.toggle('checked', state[c].approved); });
      tabs.forEach(function (t) {
        var list = tabCodes[t.id], n = countDone(list);
        t.badge.textContent = n + '/' + list.length;
        t.badge.classList.toggle('done', list.length > 0 && n === list.length);
      });
      progress.textContent = done + ' / ' + total;
      btn.textContent = (total > 0 && done === total) ? 'Aprobar y guardar' : 'Guardar progreso';
      persist();
    }

    function stamp() {
      var d = new Date(), z = function (n) { return (n < 10 ? '0' : '') + n; };
      return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + 'T' + z(d.getHours()) + ':' + z(d.getMinutes()) + ':' + z(d.getSeconds());
    }
    function offer(text, label) {
      var b = mk('button', label); b.type = 'button';
      b.addEventListener('click', function () { if (!downloadReview(text, window)) copyBox(text); });
      statusEl.appendChild(b);
    }
    function copyBox(text) {
      status('The download was blocked. Copy the text below into specs/' + meta.spec + '/review.md:');
      var box = mk('textarea'); box.readOnly = true; box.value = text; statusEl.appendChild(box);
    }

    btn.addEventListener('click', function () {
      var total = order.length, done = countDone(order), complete = total > 0 && done === total;
      var built = buildReviewMdEx({ spec: meta.spec, tasks_hash: meta.tasks_hash, sources_digest: meta.sources_digest,
        generated: meta.generated, reviewed: stamp(), codes: order, digests: digests, items: state });
      alertEl.textContent = ''; statusEl.textContent = '';
      var saving = saveReview(built.text, CTX);   /* permission and picker run first in the click handler */
      if (!complete) {
        alertEl.textContent = missingSummary({ codes: order }, checkedMap());
        for (var i = 0; i < order.length; i++) {
          var c = order[i];
          if (state[c].approved) continue;
          select(tabOfCode[c], true);
          itemEl[c].classList.add('focus');
          try { itemEl[c].scrollIntoView({ block: 'center' }); } catch (e) { /* old browser */ }
          try { boxes[c].focus({ preventScroll: true }); } catch (e) { boxes[c].focus(); }
          break;
        }
      }
      saving.then(function (r) {
        var res = r || { ok: false, method: 'copy' };
        if (res.method === 'fs') {
          status(complete ? 'Saved to specs/' + meta.spec + '/review.md. Nothing else to do: the agent is waiting and will ask you once.'
            : 'Saved to specs/' + meta.spec + '/review.md.');
        } else if (res.method === 'cancelled' || res.method === 'mismatch') {
          offer(built.text, 'Descargar review.md');
        } else if (res.method === 'copy') {
          copyBox(built.text);
        }
        if (!complete && res.method !== 'cancelled' && res.method !== 'mismatch') {
          status('Progreso guardado (' + done + '/' + total + '): no es una aprobaci\u00f3n');
        }
      }, function () { copyBox(built.text); });
    });

    var start = '';
    try { if (window.location && /^#tab-[A-Za-z0-9_-]+$/.test(window.location.hash)) start = window.location.hash.slice(5); } catch (e) { start = ''; }
    if (!start) { try { start = window.sessionStorage.getItem(tabStore) || ''; } catch (e) { start = ''; } }
    var known = tabs.some(function (t) { return t.id === start; });
    if (tabs.length) select(known ? start : tabs[0].id, false);
    refresh();
  })();
}
</script>
</body>
</html>
