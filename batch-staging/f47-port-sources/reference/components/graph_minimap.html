<!-- COMP-909: Floating Minimap & Viewport Indicator -->
<div class="minimap-container" id="minimap-container">
  <div class="minimap-header">
    <span>Radar de Red</span>
    <button id="btn-toggle-minimap" class="btn-text-xs" title="Minimizar radar">_</button>
  </div>
  <div class="minimap-body">
    <canvas id="minimap-canvas" width="160" height="110"></canvas>
    <div class="minimap-viewport-rect" id="minimap-rect"></div>
  </div>
</div>
